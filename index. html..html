<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090d14">
<title>JARVIS — Personal AI</title>
<style>
:root{color-scheme:dark;--bg:#090d14;--panel:#111a27;--line:#26394c;--blue:#62c7ff;--muted:#91a5b8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 18%,#14283a 0,#090d14 48%);color:#eef7ff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:650px;margin:auto;padding:env(safe-area-inset-top) 18px calc(22px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 2px 12px}
.brand{font-size:19px;letter-spacing:.24em;font-weight:650}.sub{color:var(--muted);font-size:10px;letter-spacing:.18em;margin-top:5px}
.status{font-size:11px;color:#8de4c0;border:1px solid #285a4c;border-radius:99px;padding:7px 10px}
.hero{display:flex;flex-direction:column;align-items:center;padding:38px 0 26px}
.orb{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;border:1px solid #3e9ac5;box-shadow:0 0 24px #278fc744,inset 0 0 28px #278fc733;position:relative;background:radial-gradient(circle,#193b52 0,#102334 52%,#0b1520 72%);transition:.25s}
.orb:before,.orb:after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid #60c9ff55}.orb:after{inset:-8px;border:1px dashed #60c9ff55}
.orb.active{animation:pulse 1.4s infinite;box-shadow:0 0 45px #278fc799,inset 0 0 35px #278fc766}
@keyframes pulse{50%{transform:scale(1.035);filter:brightness(1.3)}}
.wave{display:flex;align-items:center;gap:5px;height:48px}.wave i{display:block;width:3px;height:12px;border-radius:5px;background:#8cddff;opacity:.8}.active .wave i{animation:wave .7s ease-in-out infinite alternate}.wave i:nth-child(2n){animation-delay:.2s}.wave i:nth-child(3n){animation-delay:.4s}@keyframes wave{to{height:39px}}
h1{font-size:25px;font-weight:500;margin:27px 0 6px}.hint{color:var(--muted);font-size:14px;text-align:center}
.controls{display:flex;justify-content:center;gap:12px;margin:18px 0 26px}.btn{border:1px solid var(--line);border-radius:14px;padding:13px 17px;background:#142130;color:#eaf7ff;font-size:14px}.btn.primary{background:#bdeaff;color:#07121c;border-color:#bdeaff;font-weight:650}.btn:active{transform:scale(.98)}
.card{background:#101925;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:14px}.cardhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#c7d8e6;margin-bottom:12px}.messages{height:210px;overflow:auto;display:flex;flex-direction:column;gap:10px}.msg{max-width:88%;padding:11px 13px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-wrap}.bot{background:#192b3c;align-self:flex-start}.user{background:#214b67;align-self:flex-end}.entry{display:flex;gap:8px;margin-top:12px}.entry input{min-width:0;flex:1;background:#0a111b;border:1px solid var(--line);border-radius:12px;padding:13px;color:white;font-size:15px;outline:none}.entry input:focus{border-color:var(--blue)}
footer{text-align:center;color:#71869a;font-size:11px;padding:22px 0 5px}.lang{background:#101925;color:#dceeff;border:1px solid var(--line);border-radius:10px;padding:7px}
</style>
</head>
<body><main>
<header><div><div class="brand">J.A.R.V.I.S.</div><div class="sub">PERSONAL ASSISTANT</div></div><div class="status" id="status">● BEREIT</div></header>
<section class="hero"><div class="orb" id="orb"><div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div><h1 id="greeting">Guten Tag.</h1><div class="hint" id="hint">Ich bin bereit. Wie kann ich helfen?</div></section>
<div class="controls"><button class="btn primary" id="mic">🎙 Sprechen</button><button class="btn" id="stop">Stimme stoppen</button></div>
<section class="card"><div class="cardhead"><span>GESPRÄCH</span><select class="lang" id="lang"><option value="de-DE">Deutsch</option><option value="ar-SA">العربية</option></select></div><div class="messages" id="messages"><div class="msg bot">Hallo! Ich bin JARVIS. Du kannst mir schreiben oder – sofern dein Browser es unterstützt – auf „Sprechen“ tippen.</div></div><form class="entry" id="form"><input id="input" autocomplete="off" placeholder="Nachricht an JARVIS …"><button class="btn primary" type="submit">Senden</button></form></section>
<footer>JARVIS DEMO · Sprachfunktionen hängen von iOS und Safari ab</footer>
</main>
<script>
const $=id=>document.getElementById(id), messages=$('messages');
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
function say(text){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=$('lang').value;u.rate=.96;speechSynthesis.speak(u)}
function reply(text){const t=text.toLowerCase();let answer;
if(/hallo|guten tag|مرحبا|السلام عليكم/.test(t))answer=$('lang').value.startsWith('ar')?'أهلاً بك. أنا جارفس، كيف يمكنني مساعدتك؟':'Guten Tag. Schön, dass du da bist. Was kann ich für dich tun?';
else if(/zeit|uhr|time|الساعة/.test(t))answer=$('lang').value.startsWith('ar')?'يمكنك معرفة الوقت الحالي من شاشة هاتفك.':'Die aktuelle Uhrzeit findest du oben auf deinem iPhone.';
else if(/wer bist|اسمك|من أنت/.test(t))answer=$('lang').value.startsWith('ar')?'أنا جارفس، مساعدك الشخصي التجريبي.':'Ich bin JARVIS, dein persönlicher Assistent in der Demo-Version.';
else answer=$('lang').value.startsWith('ar')?'فهمت ما قلت. هذه نسخة تجريبية؛ لم يتم ربط الذكاء الاصطناعي بعد.':'Ich habe dich verstanden. Dies ist zunächst eine Demo – das KI-Gehirn ist noch nicht verbunden.';
add(answer,'bot');say(answer)}
$('form').addEventListener('submit',e=>{e.preventDefault();const v=$('input').value.trim();if(!v)return;add(v,'user');$('input').value='';reply(v)});
let recognition=null;
$('mic').addEventListener('click',()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('hint').textContent='Spracherkennung wird in diesem Browser nicht unterstützt. Bitte nutze das Textfeld.';return}
try{recognition=new SR();recognition.lang=$('lang').value;recognition.interimResults=false;recognition.onstart=()=>{$('orb').classList.add('active');$('status').textContent='● HÖRE ZU';$('hint').textContent='Ich höre zu …'};recognition.onend=()=>{$('orb').classList.remove('active');$('status').textContent='● BEREIT';$('hint').textContent='Ich bin bereit.'};recognition.onerror=()=>{$('hint').textContent='Mikrofon nicht verfügbar. Prüfe die Safari-Berechtigung.'};recognition.onresult=e=>{const v=e.results[0][0].transcript;add(v,'user');reply(v)};recognition.start()}catch(e){$('hint').textContent='Mikrofon konnte nicht gestartet werden.'}});
$('stop').addEventListener('click',()=>{if(recognition)recognition.stop();if('speechSynthesis'in window)speechSynthesis.cancel();$('orb').classList.remove('active');$('status').textContent='● BEREIT'});
$('lang').addEventListener('change',()=>{$('greeting').textContent=$('lang').value.startsWith('ar')?'مرحباً.':'Guten Tag.';$('hint').textContent=$('lang').value.startsWith('ar')?'أنا جاهز للمساعدة.':'Ich bin bereit. Wie kann ich helfen?';$('input').placeholder=$('lang').value.startsWith('ar')?'اكتب رسالتك إلى جارفس …':'Nachricht an JARVIS …';$('input').dir=$('lang').value.startsWith('ar')?'rtl':'ltr'});
</script></body></html>
